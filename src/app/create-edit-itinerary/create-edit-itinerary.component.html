<div class="container">
  <mat-toolbar color="primary">
    <span>{{ itineraryId ? 'Edit' : 'Create' }} Itinerary</span>
    <span class="spacer"></span>
    <button mat-button (click)="onBack()">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>
  </mat-toolbar>

  <form [formGroup]="itineraryForm" (ngSubmit)="onSubmit()" class="form-container">
    <mat-card class="form-card">
      <mat-card-content>
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Title</mat-label>
            <input matInput formControlName="title" placeholder="Enter itinerary title">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="trip_start_date">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="trip_end_date">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Total Budget</mat-label>
            <input matInput type="number" formControlName="total_budget" placeholder="Enter total budget">
            <span matPrefix>$&nbsp;</span>
          </mat-form-field>
        </div>

        <div formArrayName="destinations" class="destinations-container">
          <div *ngFor="let destination of destinations.controls; let i=index" [formGroupName]="i"
            class="destination-card">
            <mat-card>
              <mat-card-header>
                <mat-card-title>Destination {{i + 1}}</mat-card-title>
                <button mat-icon-button color="warn" (click)="removeDestination(i)">
                  <mat-icon>delete</mat-icon>
                </button>
              </mat-card-header>
              <mat-card-content>
                <div class="destination-form">
                  <mat-form-field appearance="outline">
                    <mat-label>Location</mat-label>
                    <input matInput formControlName="location" placeholder="Enter location">
                  </mat-form-field>

                  <mat-form-field appearance="outline">
                    <mat-label>Transportation Type</mat-label>
                    <input matInput formControlName="transportation_type" placeholder="Enter transportation type">
                  </mat-form-field>

                  <mat-form-field appearance="outline">
                    <mat-label>Date</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="date_time">
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                  </mat-form-field>

                  <mat-form-field appearance="outline">
                    <mat-label>Time</mat-label>
                    <input matInput type="time" formControlName="time">
                  </mat-form-field>

                  <div formGroupName="accommodation" class="accommodation-section">
                    <h3>Accommodation</h3>
                    <div class="accommodation-form">
                      <mat-form-field appearance="outline">
                        <mat-label>Name</mat-label>
                        <input matInput formControlName="name" placeholder="Enter accommodation name">
                      </mat-form-field>

                      <mat-form-field appearance="outline">
                        <mat-label>Check-in</mat-label>
                        <input matInput type="time" formControlName="check_in">
                      </mat-form-field>

                      <mat-form-field appearance="outline">
                        <mat-label>Check-out</mat-label>
                        <input matInput type="time" formControlName="check_out">
                      </mat-form-field>

                      <mat-form-field appearance="outline">
                        <mat-label>Cost</mat-label>
                        <input matInput type="number" formControlName="cost">
                        <span matPrefix>$&nbsp;</span>
                      </mat-form-field>
                    </div>
                  </div>

                  <div formArrayName="activities" class="activities-container">
                    <h3>Activities</h3>
                    <div *ngFor="let activity of getActivities(i).controls; let j=index" [formGroupName]="j"
                      class="activity-form">
                      <mat-form-field appearance="outline">
                        <mat-label>Description</mat-label>
                        <input matInput formControlName="description" placeholder="Enter activity description">
                      </mat-form-field>

                      <mat-form-field appearance="outline">
                        <mat-label>Activity Type</mat-label>
                        <input matInput formControlName="activity_type" placeholder="Enter activity type">
                      </mat-form-field>

                      <mat-form-field appearance="outline">
                        <mat-label>Time</mat-label>
                        <input matInput type="time" formControlName="time">
                      </mat-form-field>

                      <mat-form-field appearance="outline">
                        <mat-label>Duration (hours)</mat-label>
                        <input matInput type="number" formControlName="duration">
                      </mat-form-field>

                      <mat-form-field appearance="outline">
                        <mat-label>Cost</mat-label>
                        <input matInput type="number" formControlName="cost">
                        <span matPrefix>$&nbsp;</span>
                      </mat-form-field>

                      <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Notes</mat-label>
                        <textarea matInput formControlName="notes" placeholder="Enter any additional notes"></textarea>
                      </mat-form-field>

                      <button mat-icon-button color="warn" (click)="removeActivity(i, j)">
                        <mat-icon>delete</mat-icon>
                      </button>
                    </div>
                    <button mat-stroked-button type="button" (click)="addActivity(i)">
                      <mat-icon>add</mat-icon>
                      Add Activity
                    </button>
                  </div>
                </div>
              </mat-card-content>
            </mat-card>
          </div>
          <button mat-stroked-button type="button" (click)="addDestination()">
            <mat-icon>add</mat-icon>
            Add Destination
          </button>
        </div>

        <div class="form-actions">
          <button mat-button type="button" (click)="onBack()">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="!itineraryForm.valid || isLoading">
            <mat-icon>save</mat-icon>
            {{ itineraryId ? 'Update' : 'Create' }}
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </form>
</div>
