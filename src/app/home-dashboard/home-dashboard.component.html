<div class="dashboard-container">
  <mat-toolbar color="primary">
    <button mat-icon-button>
      <mat-icon>menu</mat-icon>
    </button>
    <span class="toolbar-title">Home Dashboard</span>
    <span class="spacer"></span>
    <button mat-icon-button>
      <mat-icon>account_circle</mat-icon>
    </button>
  </mat-toolbar>

  <div class="dashboard-content">
    <div class="action-buttons">
      <button mat-raised-button color="primary" class="action-button" (click)="navigateToCreate()">
        <mat-icon>add</mat-icon>
        Create New Itinerary
      </button>
    </div>

    <h2 class="section-title">Recent Itineraries</h2>
    <div class="itineraries-grid">
      <!-- Loop through itineraries -->
      <mat-card *ngFor="let itinerary of itineraries" class="itinerary-card">
        <mat-card-header>
          <mat-card-title>{{ itinerary.title }}</mat-card-title>
          <mat-card-subtitle>
            {{ itinerary.trip_start_date | date: 'MMM d, y' }} -
            {{ itinerary.trip_end_date | date: 'MMM d, y' }}
          </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <h3>Destinations:</h3>
          <ul class="destinations-list">
            <li *ngFor="let destination of itinerary.destinations">
              <span class="destination-location">{{ destination.location }}</span>
              <span class="destination-date">
                ({{ destination.date_time | date: 'MMM d, y, h:mm a' }})
              </span>
            </li>
          </ul>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="primary" (click)="navigateToView(itinerary.itinerary_id)">
            <mat-icon>visibility</mat-icon>
            View
          </button>
          <button mat-button color="accent" (click)="navigateToCreate(itinerary.itinerary_id)">
            <mat-icon>edit</mat-icon>
            Edit
          </button>
          <button mat-button color="warn" (click)="deleteItinerary(itinerary.itinerary_id)">
            <mat-icon>delete</mat-icon>
            Delete
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
