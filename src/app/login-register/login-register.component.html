<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Please login to your account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Enter your username">
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            Username is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Enter your password">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.valid || isLoading">
          <mat-icon>login</mat-icon>
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <div class="auth-actions">
        <button mat-stroked-button color="primary" (click)="openSignupPage()">
          <mat-icon>person_add</mat-icon>
          Create Account
        </button>
        <button mat-button color="primary" (click)="openForgotPasswordDialog()">
          <mat-icon>help</mat-icon>
          Forgot Password?
        </button>
      </div>

      <div class="social-login">
        <p>Or login with</p>
        <div class="social-buttons">
          <button mat-stroked-button color="primary" (click)="loginWithGoogle()">
            <mat-icon>g_mobiledata</mat-icon>
            Google
          </button>
          <button mat-stroked-button color="primary" (click)="loginWithFacebook()">
            <mat-icon>facebook</mat-icon>
            Facebook
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
